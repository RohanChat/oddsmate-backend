services:
  espn_historical:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.espn_historical
    container_name: espn_historical
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app
    command: python3.11 src/main.py  --scraper espn --mode  sync --timeframe historical
  
  espn_latest:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.espn_latest
    container_name: espn_latest
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app
    command: python3.11 src/main.py  --scraper espn --mode  sync --timeframe latest

  
  judges_async_historical:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.judges_async_historical
    container_name: judges_async_historical
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app
    command: python3.11 src/main.py  --scraper judge --mode  async --timeframe historical

  
  judges_async_latest:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.judges_async_latest
    container_name: judges_async_latest
    env_file: .env
    volumes:
      - .:/app
    command: python3.11 src/main.py  --scraper judge --mode  async --timeframe latest

  
  judges_sync_historical:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.judges_sync_historical
    container_name: judges_sync_historical
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app  
    command: python3.11 -u src/main.py  --scraper judge --mode  sync --timeframe historical

  
  judges_sync_latest:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.judges_sync_latest
    container_name: judges_sync_latest
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app  
    command: python3.11 src/main.py  --scraper judge --mode  sync --timeframe latest

  
  odds_scraping:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.odds_scraping
    container_name: odds_scraping
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app
    command: python3.11 src/main.py  --scraper odds

  
  ufc_upcoming:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.ufc_upcoming
    container_name: ufc_upcoming
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app
    command: python3.11 src/main.py  --scraper ufcstats --timeframe upcoming

  
  ufc_latest:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.ufc_latest
    container_name: ufc_latest
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    env_file: .env
    volumes:
      - .:/app
    command: python3.11 src/main.py  --scraper ufcstats  --timeframe latest

    
  postgres_db:
    image: postgres:14
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    container_name: postgres_db
    env_file: .env
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    # networks:
    #   - postgres_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5